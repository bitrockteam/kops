[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeops-kops"
version = "0.1.0"
description = "Local governed knowledge compilation and publishing demo"
requires-python = ">=3.12"
dependencies = [
  "bleach==6.4.0",
  "fastapi==0.118.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markdown-it-py==4.0.0",
  "psycopg[binary,pool]==3.2.10",
  "pydantic==2.11.9",
  "python-multipart==0.0.20",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires the Compose PostgreSQL services",
  "live_model: requires an operator-supplied local model endpoint",
]

[tool.coverage.run]
source = ["app"]
